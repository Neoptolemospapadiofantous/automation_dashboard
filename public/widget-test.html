<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Flowstack widget — local test</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:56px auto;padding:0 20px;color:#111;line-height:1.55}
button{font:14px system-ui;padding:8px 12px;margin:4px 6px 4px 0;cursor:pointer;border:1px solid #111;background:#fff}
pre{background:#f5f5f5;padding:12px;min-height:48px;font-size:12px}</style></head>
<body>
<h1>Flowstack widget — local test</h1>
<p>Blue <b>Chat</b> launcher bottom-right. Open it: you'll see the welcome line + 3 starter chips, animated thinking dots while it answers, citations under grounded replies, and an ✕ close. Reload this page → your conversation <b>resumes</b>.</p>
<p>Host API:</p>
<button onclick="window.flowstack.open()">open()</button>
<button onclick="window.flowstack.sendMessage('How much is the Starter plan?')">sendMessage(pricing)</button>
<button onclick="window.flowstack.close()">close()</button>
<h3>events</h3><pre id="log"></pre>
<script>
function log(s){document.getElementById('log').textContent+=s+'\n';}
window.addEventListener('load',function(){
  if(!window.flowstack){log('window.flowstack NOT found');return;}
  log('window.flowstack ready');
  window.flowstack.on('ready',()=>log('event: ready'));
  window.flowstack.on('open',()=>log('event: open'));
  window.flowstack.on('message',d=>log('event: message — '+String(d.text||'').slice(0,60)));
});
</script>
<script src="/widget/agent-gzap8n82p2.js" defer></script>
</body></html>
