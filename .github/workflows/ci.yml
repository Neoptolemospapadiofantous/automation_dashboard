# CI — GitHub mirror of the local hermes watchdog (scripts/hermes.sh):
# pint, phpstan, full test suite, config/route/migration boot checks,
# composer audit — plus gitleaks secret scanning and the frontend build.
# Strategy reference: PROJECT_ASSURANCE_STRATEGY.md, Category I2.
name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Tests + boot checks run on MariaDB (the dev/test DB was migrated off
    # SQLite). Match phpunit.xml: db automation_dashboard_test, flowstack/flowstack.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: automation_dashboard_test
          MARIADB_USER: flowstack
          MARIADB_PASSWORD: flowstack
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: pdo_mysql

      - run: composer install --no-interaction --prefer-dist

      - run: composer validate --strict

      - run: composer audit

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      # Tests use the MariaDB service (phpunit.xml env wins over .env); the
      # app still needs a base .env + APP_KEY to boot.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # NOT --parallel: RefreshDatabase on a single shared MariaDB connection.
      - run: php artisan test

      # Boot checks, mirroring hermes: config cacheable, routes register,
      # migrations run cleanly. config:cache runs AFTER the tests — cached
      # config would override phpunit.xml env vars. Point migrate at the test
      # DB the service already provisioned.
      - name: Boot checks
        env:
          DB_DATABASE: automation_dashboard_test
        run: |
          php artisan config:cache
          php artisan route:list -q
          php artisan config:clear
          php artisan migrate --force

      - name: Doc coverage
        run: python3 scripts/doc_coverage.py # every app/ subsystem must be documented or waived

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # resources/js/app.js imports Ziggy from vendor/tightenco/ziggy, so the
      # Composer vendor dir must exist before the vite build resolves it.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # --ignore-platform-reqs: this job's bare PHP lacks some runtime
      # extensions, but we only need the vendor files (Ziggy's JS), not a
      # working PHP runtime.
      - run: composer install --no-interaction --prefer-dist --no-scripts --ignore-platform-reqs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod --audit-level high
      - run: pnpm run knip # frontend dead-code gate (unused files/exports)
      - run: pnpm run build
