# gitleaks config. CI scans full history (fetch-depth: 0), so historical
# fixtures surface even after the file is deleted. Extend the default
# ruleset and allowlist one known dummy value.
[extend]
useDefault = true

[allowlist]
description = "Dummy test webhook secret 'sek-1234567890' in the deleted Voiceflow lifecycle webhook test — a fixture, never a real credential."
regexes = [
  '''sek-1234567890''',
]
paths = [
  '''tests/Feature/VoiceflowSessionLifecycleWebhookTest\.php''',
]
