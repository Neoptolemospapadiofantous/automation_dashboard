# gitleaks config. CI scans full history (fetch-depth: 0), so fixtures and a
# since-removed/rotated key surface even after the files are cleaned up.
# Extend the default ruleset and allowlist the known-safe values BY PATH
# (we deliberately don't embed the real key value here).
[extend]
useDefault = true

[allowlist]
description = "Historical test fixtures + a removed/rotated Voiceflow key in old commits — none are live credentials."
regexes = [
  '''sek-1234567890''',
  '''test-key-bytes-32-long-padding-aa''',
]
paths = [
  '''tests/Feature/VoiceflowSessionLifecycleWebhookTest\.php''',
  '''tests/Feature/VoiceflowSvixVerificationTest\.php''',
  '''docs/operations/ship-fast-plan\.md''',
]
